<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Football Legacy — 3v3 Dots</title>
<style>
  :root{--navy:#06182c;--orange:#e87824;--cream:#f7f1e7;--muted:#aab7c5;}
  *{box-sizing:border-box;} html,body{margin:0;height:100%;overflow:hidden;background:#03101f;font-family:Arial,Helvetica,sans-serif;color:var(--cream);}
  #wrap{position:fixed;inset:0;display:grid;place-items:center;}
  canvas{display:block;background:#2f7d3a;box-shadow:0 20px 60px rgba(0,0,0,.5);outline:none;}
  .hud{position:fixed;top:0;left:0;right:0;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5;}
  .sc{display:flex;gap:20px;} .t{text-align:center;} .l{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
  .n{font-size:1.8rem;font-weight:800;line-height:1;} .n.you{color:var(--orange);} .n.opp{color:#dce7f2;}
  .tag{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(247,241,231,.4);}
  .controls{position:fixed;bottom:0;left:0;right:0;padding:10px;text-align:center;z-index:5;pointer-events:none;font-size:.72rem;color:rgba(247,241,231,.72);}
  .controls b{color:var(--orange);}
  .flash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6;}
  .flash span{font-size:clamp(2.2rem,8vw,4.6rem);font-weight:800;text-transform:uppercase;opacity:0;transform:scale(.8);transition:opacity .18s,transform .18s;text-shadow:0 6px 26px rgba(0,0,0,.5);}
  .flash span.show{opacity:1;transform:scale(1);}
  .start{position:fixed;inset:0;display:grid;place-items:center;z-index:7;background:rgba(3,16,31,.7);cursor:pointer;}
  .start div{text-align:center;} .start h2{margin:0 0 6px;color:var(--orange);text-transform:uppercase;letter-spacing:.1em;}
  .start p{margin:0;color:var(--muted);letter-spacing:.08em;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" tabindex="0"></canvas></div>
<div class="hud">
  <div class="sc"><div class="t"><div class="l">You</div><div class="n you" id="youS">0</div></div>
  <div class="t"><div class="l">Rivals</div><div class="n opp" id="oppS">0</div></div></div>
  <div class="t" style="text-align:center;"><div class="l">Match</div><div class="n" id="clock" style="color:#f7f1e7;">0'</div></div>
  <div class="tag">Football Legacy · 11v11</div>
</div>
<div class="flash"><span id="flash">GOAL!</span></div>
<div class="ftime" id="ftime" style="position:fixed;inset:0;z-index:8;display:none;place-items:center;background:rgba(3,16,31,.85);">
  <div style="text-align:center;">
    <div style="font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:#aab7c5;">Full Time</div>
    <div id="ftScore" style="font-size:3.4rem;font-weight:800;margin:8px 0;"></div>
    <div id="ftMsg" style="color:#aab7c5;margin-bottom:24px;letter-spacing:.06em;"></div>
    <button id="ftBtn" style="padding:14px 34px;border:1px solid #e87824;background:#e87824;color:#03101f;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;">Play Again</button>
  </div>
</div>
<div class="controls"><b>Arrows</b> move · <b>A</b> pass (hold=power) · <b>S</b> shoot (hold=power) · <b>D</b> tackle · <b>Q</b> skill (+←/→) · <b>W</b> switch</div>
<div id="nameBanner" style="position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:7;background:rgba(3,16,31,.85);border-left:4px solid #e87824;padding:7px 20px 7px 16px;color:#f7f1e7;font-weight:700;letter-spacing:.1em;font-size:15px;display:none;text-transform:uppercase;"></div>
<canvas id="radar" width="240" height="150" style="position:fixed;right:16px;bottom:52px;z-index:7;background:rgba(3,16,31,.32);border:1px solid rgba(255,255,255,.18);border-radius:6px;"></canvas>
<div id="scorerTag" style="position:fixed;left:0;right:0;top:54%;text-align:center;z-index:8;color:#f7f1e7;font-weight:800;letter-spacing:.12em;text-transform:uppercase;display:none;text-shadow:0 2px 12px rgba(0,0,0,.6);"><div id="scorerName" style="font-size:2rem;"></div><div id="scorerSub" style="font-size:1rem;opacity:.8;margin-top:4px;"></div></div>
<div id="dbg" style="display:none;"></div>
<div class="start" id="start"><div style="text-align:center;">
  <h2>Football Legacy</h2>
  <p style="opacity:.75;margin:6px 0 16px;">Choose your difficulty</p>
  <div style="display:flex;gap:12px;justify-content:center;">
    <button class="diffbtn" data-diff="easy" style="padding:12px 22px;border:1px solid #4ade80;background:transparent;color:#4ade80;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:4px;">Easy</button>
    <button class="diffbtn" data-diff="medium" style="padding:12px 22px;border:1px solid #e87824;background:#e87824;color:#03101f;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:4px;">Medium</button>
    <button class="diffbtn" data-diff="hard" style="padding:12px 22px;border:1px solid #f87171;background:transparent;color:#f87171;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:4px;">Hard</button>
    <button class="diffbtn" data-diff="legend" style="padding:12px 22px;border:1px solid #c084fc;background:transparent;color:#c084fc;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:4px;">Legend</button>
  </div>
  <p style="opacity:.55;margin-top:18px;font-size:.85em;">Arrows move · A pass · S shoot · D tackle · W switch</p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const cv=document.getElementById('c');
  const renderer=new THREE.WebGLRenderer({canvas:cv, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.82;
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x6f96b8);   // daytime sky (deeper)
  scene.fog=new THREE.Fog(0x8fb4d6, 2400, 4200);
  const camera=new THREE.PerspectiveCamera(58, 1, 1, 8000);
  const youS=document.getElementById('youS'), oppS=document.getElementById('oppS'), flash=document.getElementById('flash'), startEl=document.getElementById('start');
  const clockEl=document.getElementById('clock'), ftime=document.getElementById('ftime'), ftScore=document.getElementById('ftScore'), ftMsg=document.getElementById('ftMsg'), ftBtn=document.getElementById('ftBtn');
  const MATCH_FRAMES=7200;                 // ~2 real minutes (at 60fps) = 90 match minutes
  ftBtn.addEventListener('click',()=>{ youScore=0;oppScore=0;youS.textContent=0;oppS.textContent=0;
    clockFrames=0;matchOver=false;halfDone=false;ftime.style.display='none';kickoff('you'); });
  const W=3200, H=2050, GOAL_H=H*0.135, M=80; let started=false;   // full-size pitch — camera follows the ball
  function worldX(gx){ return gx - W/2; }
  function worldZ(gy){ return gy - H/2; }
  function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  resize(); addEventListener('resize',resize);

  const rad=12, DEAD=6, ARRIVE=110, SEP=44, SPEED=2.95, BALLR=6;
  const keys={};
  const DIFF = {
    easy:   { oppSpeed:0.82, press:0.6, shootChance:0.5, shootSpread:1.9, tackle:0.55, keeperDive:0.7,  playerAim:1 },
    medium: { oppSpeed:1.0,  press:1.0, shootChance:1.0, shootSpread:1.0, tackle:1.0,  keeperDive:1.0,  playerAim:1 },
    hard:   { oppSpeed:1.12, press:1.35,shootChance:1.6, shootSpread:0.6, tackle:1.35, keeperDive:1.25, playerAim:1 },
    legend: { oppSpeed:1.2,  press:1.6, shootChance:1.9, shootSpread:0.45,tackle:1.55, keeperDive:1.4,  playerAim:2.2 }   // toughest AI + YOUR aim must be sharp
  };
  let D0 = DIFF.medium;
  function focusGame(diff){ D0 = DIFF[diff]||DIFF.medium; cv.focus(); initAudio(); kickoff('you'); started=true; startEl.style.display='none';
    // walk-out: two single-file columns (your team + rivals) side by side, filing out from the near end
    const colIndex=(p)=>{ const team=p.team==='you'?you:opp; let i=team.indexOf(p); return i<0?10:i; };
    [...you,...opp,ykeep,okeep].forEach(p=>{ const side=p.team==='you'?-1:1; p.x=W/2+side*46; p.y=H+40+colIndex(p)*30; });
    matchPhase='walkout'; walkoutLineUntil=performance.now()+3400; walkoutUntil=performance.now()+6000;
  }
  function walkPhase(targetFn, sp){
    [...you,...opp,ykeep,okeep].forEach(p=>{ const t=targetFn(p); steer(p, t.x, t.y, sp, p.team==='you'?you:opp); p.x+=p.vx*DT; p.y+=p.vy*DT; });
    ball.x=W/2; ball.y=H/2; ball.z=0; ball.zv=0; ball.owner=null;
  }
  function inReset(){ return performance.now() < resetUntil; }
  document.querySelectorAll('.diffbtn').forEach(b=> b.addEventListener('click', ()=>focusGame(b.dataset.diff)));

  // ---- sound (generated in-browser, no files) ----
  let actx=null, ambienceOn=false;
  function initAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); startAmbience(); }
  function startAmbience(){ if(!actx||ambienceOn)return; ambienceOn=true;
    // looping filtered noise = soft crowd murmur
    const dur=4, b=actx.createBuffer(1, actx.sampleRate*dur, actx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=actx.createBufferSource(); src.buffer=b; src.loop=true;
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650; lp.Q.value=0.6;
    const g=actx.createGain(); g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.06, actx.currentTime+2.5);   // gentle fade-in
    src.connect(lp).connect(g).connect(actx.destination); src.start();
    // slow swell so it breathes like a crowd
    const lfo=actx.createOscillator(), lfg=actx.createGain(); lfo.frequency.value=0.08; lfg.gain.value=0.02; lfo.connect(lfg).connect(g.gain); lfo.start();
  }
  function kickSound(power){ if(!actx)return; const t=actx.currentTime;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(220+120*(power||0.4), t); o.frequency.exponentialRampToValueAtTime(70, t+0.09);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35, t+0.008); g.gain.exponentialRampToValueAtTime(0.0001, t+0.13);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.14);
    // a little 'tap' click on top
    const n=actx.createBufferSource(), b=actx.createBuffer(1,400,actx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3); n.buffer=b;
    const ng=actx.createGain(); ng.gain.value=0.18; n.connect(ng).connect(actx.destination); n.start(t);
  }
  function whistle(){ if(!actx)return; peep(actx.currentTime, 0.3); }
  function peep(t, len){ if(!actx)return;
    const o=actx.createOscillator(), g=actx.createGain(), v=actx.createOscillator(), vg=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(2000,t);
    v.type='sine'; v.frequency.value=28; vg.gain.value=60; v.connect(vg).connect(o.frequency); v.start(t); v.stop(t+len);   // trill warble
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.28,t+0.015); g.gain.setValueAtTime(0.28,t+len-0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+len+0.02);
  }
  function goalWhistle(){ if(!actx)return; const t=actx.currentTime;   // three sharp peeps = goal
    peep(t, 0.16); peep(t+0.22, 0.16); peep(t+0.44, 0.5);
  }
  function cheer(big){ if(!actx)return; const t=actx.currentTime, dur=big?2.6:1.4, peak=big?0.42:0.18;
    // warm, rounded crowd roar (no shrill top end)
    const n=actx.createBufferSource(), b=actx.createBuffer(1, Math.floor(actx.sampleRate*dur), actx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++){ d[i]=(Math.random()*2-1); }
    n.buffer=b; n.loop=true;
    const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=300;
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500;   // roll off the harsh highs → distant crowd, not a scream
    const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+0.25); g.gain.setValueAtTime(peak,t+dur*0.55); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    // very gentle slow swell (breathing crowd), not a fast raptor warble
    const trem=actx.createOscillator(), tg=actx.createGain(); trem.type='sine'; trem.frequency.value=3.2; tg.gain.value=peak*0.15;
    trem.connect(tg).connect(g.gain); trem.start(t); trem.stop(t+dur);
    n.connect(hp).connect(lp).connect(g).connect(actx.destination); n.start(t); n.stop(t+dur);
    if(big) whistle();
  }
  // game starts from a difficulty button
  addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright','w','s','a','q'].includes(k))e.preventDefault();
    if(!keys[k]){                                   // first press only
      const canKick = started && (hasBall(controlled) || ball.owner===ykeep);
      if(k==='a' && canKick){ if(ball.owner===ykeep) keeperKick(ykeep); else if(chargeAction===null) chargeAction='pass'; }   // A = pass (hold to power)
      else if(k==='s' && chargeAction===null && canKick) chargeAction='shoot';
      if(k==='d' && started){
        if(dTapTimer){ clearTimeout(dTapTimer); dTapTimer=null; doSlide(); }   // 2nd tap within window → SLIDE
        else { dTapTimer=setTimeout(()=>{ dTapTimer=null; doPoke(); }, 210); }  // single tap → quick poke
      }
      if(k==='w') switchPlayer();   // W = switch player
      if(k==='q' && started && controlled && hasBall(controlled) && controlled.skill<=0 && controlled.stun<=0 && controlled.slide<=0) doSkill();   // Q = stepover
    }
    keys[k]=true;
  });
  addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); keys[k]=false;
    if(k==='a' && chargeAction==='pass'){ doPass(chargeAmt); chargeAction=null; chargeAmt=0; }
    if(k==='s' && chargeAction==='shoot'){ doShoot(chargeAmt); chargeAction=null; chargeAmt=0; }
    // (tackle is now tap = poke, double-tap = slide, handled on keydown)
  });

  const YOUNAMES=['Harper','Wright','Ellison','Boyd','Nakamura','Okafor','Da Costa','Lindqvist','Mensah','Novak','Reyes'];
  const OPPNAMES=['Kovac','Salib','Turner','Voss','Marchetti','Pardo','Ihara','Blom','Achebe','Rosen','Faulkner'];
  let lastTouchPlayer=null, celebratingPlayer=null, celebrateTeam=null, celebrateCorner={x:0,y:0};
  function mk(x,y,team,role){return {x,y,vx:0,vy:0,team,role,fx:team==='you'?1:-1,fy:0,homeX:x,homeY:y,stun:0,tcd:0,lunge:0,slide:0,slideWon:false,phase:Math.random()*6,name:'',skill:0,fouled:false};}
  let you=[],opp=[],ykeep,okeep,ball,controlled,youScore=0,oppScore=0,celebrate=0,lastConceded='you',oppChaser=null,poss=0,kickoffHeld=false,chargeAction=null,chargeAmt=0,tackleCharging=false,tackleAmt=0,lastTouch='you',restartMsg='',restartTimer=0,restartTaker=null,resetPause=0,resetUntil=0,clockFrames=0,matchOver=false,halfDone=false,dTapTimer=null;

  function kickoff(who){                            // 'who' = team kicking off (the conceding side)
    you=[ mk(W*0.12,H*0.18,'you','def'), mk(W*0.12,H*0.40,'you','def'), mk(W*0.12,H*0.60,'you','def'), mk(W*0.12,H*0.82,'you','def'),
          mk(W*0.28,H*0.16,'you','mid'), mk(W*0.28,H*0.40,'you','mid'), mk(W*0.28,H*0.60,'you','mid'), mk(W*0.28,H*0.84,'you','mid'),
          mk(W*0.42,H*0.38,'you','fwd'), mk(W*0.42,H*0.62,'you','fwd') ];
    opp=[ mk(W*0.88,H*0.18,'opp','def'), mk(W*0.88,H*0.40,'opp','def'), mk(W*0.88,H*0.60,'opp','def'), mk(W*0.88,H*0.82,'opp','def'),
          mk(W*0.72,H*0.16,'opp','mid'), mk(W*0.72,H*0.40,'opp','mid'), mk(W*0.72,H*0.60,'opp','mid'), mk(W*0.72,H*0.84,'opp','mid'),
          mk(W*0.58,H*0.38,'opp','fwd'), mk(W*0.58,H*0.62,'opp','fwd') ];
    ykeep=mk(M+16,H*0.5,'you','gk'); ykeep.isGK=true;
    okeep=mk(W-M-16,H*0.5,'opp','gk'); okeep.isGK=true;
    you.forEach((p,i)=> p.name=YOUNAMES[i]); opp.forEach((p,i)=> p.name=OPPNAMES[i]);
    ykeep.name=YOUNAMES[10]; okeep.name=OPPNAMES[10]; celebratingPlayer=null;
    ball={x:W*0.5,y:H*0.5,vx:0,vy:0,z:0,zv:0,owner:null,cool:0};
    poss=0; oppChaser=null; kickoffHeld=true;       // opponents wait until the ball is first played
    // the kicking team's striker stands over the ball on the centre spot
    const kteam = (who==='opp') ? opp : you;
    const taker = kteam.find(p=>p.role==='fwd') || kteam[kteam.length-1];
    taker.x = W*0.5 + (who==='opp' ? (rad+3) : -(rad+3)); taker.y = H*0.5;
    ball.owner = taker;
    controlled = (who==='opp') ? (you.find(p=>p.role==='fwd') || you[0]) : taker;
    restartTaker = taker; lastTouch = taker.team; resetUntil = performance.now()+3000;
  }
  kickoff('you');

  const BOX_D=W*0.11, BOX_H=GOAL_H*1.95;
  function inLeftBox(x,y){ return x < M+BOX_D && Math.abs(y-H/2) < BOX_H/2; }
  function inRightBox(x,y){ return x > W-M-BOX_D && Math.abs(y-H/2) < BOX_H/2; }
  function awardFoul(foulingTeam, x, y){
    const victim = foulingTeam==='you' ? 'opp' : 'you';
    if(foulingTeam==='you' && inLeftBox(x,y)) return awardPenalty('opp');    // foul in your box → pen to them
    if(foulingTeam==='opp' && inRightBox(x,y)) return awardPenalty('you');   // foul in their box → pen to you
    goalWhistle(); showFlash('FREE KICK', '#f7f1e7');
    restart('FREE KICK', victim, clamp(x,M+30,W-M-30), clamp(y,30,H-30));
  }
  function awardPenalty(team){
    goalWhistle(); showFlash('PENALTY!', '#f5d81a');
    const dk = team==='you' ? okeep : ykeep;                                 // defending keeper onto the line
    dk.x = team==='you' ? W-M-8 : M+8; dk.y=H/2; dk.vx=dk.vy=0; dk.stun=0;
    const spotX = team==='you' ? W-M-BOX_D*0.5 : M+BOX_D*0.5;
    restart('PENALTY', team, spotX, H/2);
  }
  function restart(kind, team, x, y){
    ball={x,y,vx:0,vy:0,z:0,zv:0,owner:null,cool:0};
    let taker;
    if(kind==='GOAL KICK'){ taker = team==='you'?ykeep:okeep; }
    else { const mates=(team==='you'?you:opp).filter(p=>!p.isGK);
      taker = mates.reduce((a,b)=> (Math.hypot(b.x-x,b.y-y)<Math.hypot(a.x-x,a.y-y)?b:a)); }
    taker.x=x; taker.y=y; taker.vx=taker.vy=0; taker.stun=0; taker.slide=0;
    ball.owner=taker; lastTouch=team; poss=8; kickoffHeld=true; oppChaser=null; restartTaker=taker;
    resetUntil = performance.now()+3000;   // ~3s "get ready" settle (real time, refresh-rate independent)
    if(team==='you') controlled=taker;
    restartMsg=kind; restartTimer=90;
  }

  const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const hasBall=p=>ball.owner===p;
  function switchPlayer(){
    if(!started || hasBall(controlled) || (controlled&&controlled.slide>0)) return;    // can't switch off your ball-carrier or mid-slide
    let best=null, bd=1e9;
    you.forEach(p=>{ if(p===controlled)return; const d=D(p,ball); if(d<bd){bd=d;best=p;} });
    if(best) controlled=best;                       // pick the man closest to the ball
  }
  function facing(p){ const d=Math.hypot(p.fx,p.fy)||1; return {x:p.fx/d,y:p.fy/d}; }

  function aiRestartPass(taker){
    const mates=(taker.team==='you'?you:opp).filter(p=>p!==taker && !p.isGK);
    if(!mates.length){ return; }
    // pick a nearby teammate who's a bit further onto the pitch (toward their attacking goal)
    const goalX = taker.team==='you'? W-M : M;
    let best=mates[0], bs=-1e9;
    mates.forEach(p=>{ const d=Math.hypot(p.x-taker.x,p.y-taker.y);
      const forward = taker.team==='you'? (p.x-taker.x) : (taker.x-p.x);   // toward their goal
      const score = forward*1.0 - d*0.5;    // prefer a forward option that's not too far
      if(d>40 && score>bs){ bs=score; best=p; } });
    const dx=best.x-taker.x, dy=best.y-taker.y, d=Math.hypot(dx,dy)||1, sp=clamp(6+d*0.05,8,15);

        else if(lastTouch==='you'){ restart('GOAL KICK','opp', W-M-34, H/2); }
        else { restart('CORNER','you', W-M-10, ball.y<H/2?top+10:bot-10); }

    }
  }

  function camFollow(){
    // smoothly track the ball (with a little lead in its direction of travel)
    const bx=worldX(ball.x) + (ball.vx||0)*3, bz=worldZ(ball.y) + (ball.vy||0)*4;   // gentler lead
    // clamp the look-point so the view never runs off the pitch edges
    const cx=clamp(bx, -W*0.30, W*0.30), cz=clamp(bz, -H*0.16, H*0.22);
    camLookX += (cx-camLookX)*0.035; camLookZ += (cz-camLookZ)*0.05;   // smoother, x eased more than z
    const HEIGHT=310, BACK=560;                                       // lower, flatter angle — more width in frame
    camera.position.set(camLookX, HEIGHT, camLookZ + BACK);
    camera.lookAt(camLookX, 20, camLookZ - 90);
  }

  function makePitchTexture(){
    const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
    for(let i=0;i<18;i++){ g.fillStyle=i%2?'#3f7d3a':'#357034'; g.fillRect(i*(W/18),0,W/18,H); }
    // faint mow texture
    g.globalAlpha=0.05; for(let k=0;k<2200;k++){ g.fillStyle=Math.random()<.5?'#2c5e2b':'#4a8a45'; g.fillRect(Math.random()*W,Math.random()*H,3,3); } g.globalAlpha=1;
    g.strokeStyle='rgba(255,255,255,.72)'; g.lineWidth=4; const top=6,bot=H-6,cy=H/2;
    g.strokeRect(M,top,W-2*M,bot-top);
    g.beginPath();g.moveTo(W/2,top);g.lineTo(W/2,bot);g.stroke();
    g.beginPath();g.arc(W/2,cy,H*0.15,0,7);g.stroke();
    g.beginPath();g.arc(W/2,cy,5,0,7);g.fillStyle='#fff';g.fill();
    const penW=(W-2*M)*0.16,penH=(bot-top)*0.55,sixW=(W-2*M)*0.06,sixH=(bot-top)*0.30,spot=(W-2*M)*0.11;
    [[M,1],[W-M,-1]].forEach(([gx,sgn])=>{
      g.strokeRect(sgn>0?gx:gx-penW, cy-penH/2, penW, penH);
      g.strokeRect(sgn>0?gx:gx-sixW, cy-sixH/2, sixW, sixH);
      g.beginPath();g.arc(gx+sgn*spot,cy,5,0,7);g.fillStyle='#fff';g.fill();
    });
    const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;

  function buildGoal(gx){
    const grp=new THREE.Group(); const white=new THREE.MeshStandardMaterial({color:0xf2f2f2,roughness:.5});
    const hh=70, hw=GOAL_H/2, R=3.5, depth=44, dir = gx<0?1:-1;   // goal opens toward the pitch
    const post=new THREE.CylinderGeometry(R,R,hh,10);
    [-hw,hw].forEach(z=>{ const p=new THREE.Mesh(post,white); p.position.set(gx,hh/2,z); grp.add(p); });
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(R,R,hw*2,10),white); bar.rotation.x=Math.PI/2; bar.position.set(gx,hh,0); grp.add(bar);
    // ---- proper net: dense grid on back, roof and both sides ----
    const netMat=new THREE.LineBasicMaterial({color:0xeaf0f6, transparent:true, opacity:.4});
    const pts=[]; const bx=gx+dir*depth; const step=7;
    const xEnd=(cb)=>{ for(let x=gx; dir>0? x<=bx+0.1 : x>=bx-0.1; x+=dir*step) cb(x); };
    // back wall
    for(let z=-hw; z<=hw+1; z+=step){ pts.push(bx,0,z, bx,hh,z); }
    for(let y=0; y<=hh+1; y+=step){ pts.push(bx,y,-hw, bx,y,hw); }
    // roof
    for(let z=-hw; z<=hw+1; z+=step){ pts.push(gx,hh,z, bx,hh,z); }
    xEnd(x=>pts.push(x,hh,-hw, x,hh,hw));
    // side walls
    [-hw,hw].forEach(z=>{ xEnd(x=>pts.push(x,0,z, x,hh,z));
      for(let y=0; y<=hh+1; y+=step){ pts.push(gx,y,z, bx,y,z); } });
    const gb=new THREE.BufferGeometry(); gb.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
    grp.add(new THREE.LineSegments(gb,netMat));
    return grp;
  }

  function place(mesh,p,highlighted){ if(!mesh)return;
    const wx=worldX(p.x), wz=worldZ(p.y), u=mesh.userData;
    // speed from frame-to-frame movement
    const dx=wx-(u.px||wx), dz=wz-(u.pz||wz), spd=Math.hypot(dx,dz); u.px=wx; u.pz=wz;
    mesh.position.x=wx; mesh.position.z=wz;
    // face travel direction
    if(spd>0.3) u.faceY=Math.atan2(dx,dz)+Math.PI;    // model's front is +z; turn it to point along travel
    mesh.rotation.y = (u.faceY===undefined?0:u.faceY);
    const sliding = (p&&p.slide>0), sprawled = (p&&p.stun>0), cheering = (p&&p.celeb==='cheer');
    if(cheering){
      // GOAL celebration — arms up, little jump
      u.phase += 0.4; const j=Math.abs(Math.sin(u.phase))*11;
      mesh.rotation.x=0; mesh.rotation.z=0; mesh.position.y=j;
      if(u.legL){ u.legL.rotation.x=0.2; u.legR.rotation.x=-0.2; u.armL.rotation.x=-2.6; u.armR.rotation.x=-2.6; u.kneeL.rotation.x=-0.15; u.kneeR.rotation.x=-0.15; u.elbL.rotation.x=0.25; u.elbR.rotation.x=0.25; }
    } else if(p && p.skill>0){
      // stepover — quick fancy foot shuffle
      u.phase += 0.85; const s=Math.sin(u.phase);
      mesh.rotation.x=0; mesh.rotation.z=s*0.16; mesh.position.y=1.5;
      if(u.legL){ u.legL.rotation.x=s*1.25; u.legR.rotation.x=-s*1.25;
        u.kneeL.rotation.x=-Math.abs(s)*0.9; u.kneeR.rotation.x=-Math.abs(s)*0.9;
        u.armL.rotation.x=-s*0.7; u.armR.rotation.x=s*0.7; u.elbL.rotation.x=0.4; u.elbR.rotation.x=0.4; }
    } else if(sliding || sprawled){
      if(sliding){
        // feet-first slide: body low and leaning back, lead leg stretched out toward the ball
        mesh.rotation.x = 0.95; mesh.position.y = 6;
        if(u.legL){ u.legL.rotation.x=-1.1; u.legR.rotation.x=-0.4; u.kneeL.rotation.x=0; u.kneeR.rotation.x=-0.5;
          u.armL.rotation.x=-0.5; u.armR.rotation.x=-0.9; u.elbL.rotation.x=0.4; u.elbR.rotation.x=0.4; }
      } else {
        // sprawled — a fallen heap after a missed slide
        mesh.rotation.x = -1.35; mesh.position.y = 5;
        if(u.legL){ u.legL.rotation.x=0.5; u.legR.rotation.x=-0.3; u.kneeL.rotation.x=-0.4; u.kneeR.rotation.x=-0.9;
          u.armL.rotation.x=0.8; u.armR.rotation.x=-0.6; u.elbL.rotation.x=0.5; u.elbR.rotation.x=0.5; }
      }
    } else {
      // ---- simple, clean run cycle (legs swing at the hip, always reads forward) ----
      u.phase += Math.min(spd,7)*0.13; const amp=Math.min(1, spd/3.2);
      const sw=Math.sin(u.phase)*amp;                 // stride phase
      mesh.position.y = amp * (1.2 + Math.abs(Math.cos(u.phase))*1.8);   // gentle bob
      mesh.rotation.x = -amp * 0.16;                  // lean forward into the run (chest slightly down)
      mesh.rotation.z = 0;
      if(u.legL){
        u.legL.rotation.x =  sw*0.95; u.legR.rotation.x = -sw*0.95;      // whole legs swing fore/aft
        // knees flex as each leg swings back and lifts (tucks behind), straighter on the forward reach
        u.kneeL.rotation.x = -Math.max(0, Math.sin(u.phase))*1.4*amp - 0.1;
        u.kneeR.rotation.x = -Math.max(0,-Math.sin(u.phase))*1.4*amp - 0.1;
        u.armL.rotation.x = -sw*0.7; u.armR.rotation.x =  sw*0.7;        // arms swing opposite the legs
        // elbows stay bent and pump a little through the swing (no more stiff sticks)
        u.elbL.rotation.x = 0.75 + Math.max(0,-sw)*0.7; u.elbR.rotation.x = 0.75 + Math.max(0, sw)*0.7;
      }
    }
    if(u.ring) u.ring.material.opacity = highlighted?0.9:0;
  }

  function draw(){
    if(!scene3dBuilt) build3D();
    for(let i=0;i<10;i++){ place(youMeshes[i], you[i]||{x:-999,y:-999}, you[i]===controlled); }
    for(let i=0;i<10;i++){ place(oppMeshes[i], opp[i]||{x:-999,y:-999}, false); }
    place(ykeepMesh, ykeep, ykeep===controlled); place(okeepMesh, okeep, false);
    // ref stays central, drifting only gently toward the play
    const rtx = clamp(W/2 + (ball.x-W/2)*0.30, W*0.32, W*0.68);
    const rty = clamp(H/2 + (ball.y-H/2)*0.30, H*0.34, H*0.66);
    ref.x += (rtx-ref.x)*0.02; ref.y += (rty-ref.y)*0.02;
    place(refMesh, ref, false);
    // linesmen patrol the two touchlines, staying level with the ball
    const bx=clamp(ball.x, M, W-M);
    lino1.x += (bx-lino1.x)*0.06; lino1.y=10;  lino1.fx=0; lino1.fy=1;
    lino2.x += (bx-lino2.x)*0.06; lino2.y=H-10; lino2.fx=0; lino2.fy=-1;
    place(lino1Mesh, lino1, false); place(lino2Mesh, lino2, false);
    // ball with height
    ballMesh.position.set(worldX(ball.x), (ball.z||0)+BALLR*1.05, worldZ(ball.y));
    // crowd sway — gentle rolling motion so the stands feel alive
    if(crowd && crowdBaseY){ crowdT+=0.05; const pa=crowd.geometry.attributes.position, arr=pa.array;
      for(let i=0;i<crowdBaseY.length;i++){ arr[i*3+1] = crowdBaseY[i] + Math.sin(crowdT + i*0.35)*1.8; }
      pa.needsUpdate=true; }
    // FIFA-style name banner for the player you're controlling
    const nb=document.getElementById('nameBanner');
    if(started && controlled && controlled.name){ nb.style.display='block'; nb.textContent = controlled.name; }
    else nb.style.display='none';
    camFollow();
    drawRadar();
    renderer.render(scene,camera);
    // ---- debug readout ----
    const dbg=document.getElementById('dbg'); if(dbg){
      const own = ball.owner ? (ball.owner.isGK?ball.owner.team+'-GK':ball.owner.team+'-'+ball.owner.role) : 'LOOSE';
      const oppHave = ball.owner && ball.owner.team==='opp';
      const state = kickoffHeld?'FREEZE': inReset()?'RESET': oppHave?'OPP-ATTACK': (ball.owner&&ball.owner.team==='you')?'YOU-ATTACK':'LOOSE-BALL';
      const oppXs = opp.map(p=>Math.round(p.x/W*100)).join(',');
      dbg.textContent =
        'state: '+state+'\n'+
        'ball owner: '+own+'\n'+
        'ball x%: '+Math.round(ball.x/W*100)+'  y%: '+Math.round(ball.y/H*100)+'\n'+
        'opp x% each: '+oppXs+'  (goal=97, halfway=50)';
    }
  }

  let DT=1, _lastT=0;
  function loop(now){
    if(!_lastT)_lastT=now||performance.now();
    const t=now||performance.now();
    DT=Math.min(3, Math.max(0.2, (t-_lastT)/16.667));   // 1.0 at 60fps; clamps guard against stalls
    _lastT=t;
    try{ update(); draw(); }catch(err){} requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
