<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Football Legacy — Instant Result</title>
<style>
  :root{--navy:#06182c;--navy2:#0b223b;--cream:#f5f0e7;--muted:#aeb9c5;--orange:#e87824;--green:#2f9a67}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#041324,#0b2a43);color:var(--cream);font-family:Arial,Helvetica,sans-serif}
  body{display:grid;place-items:center;padding:28px}.card{width:min(900px,100%);background:#071a2e;border:1px solid rgba(255,255,255,.12);box-shadow:0 28px 80px rgba(0,0,0,.42)}
  header{padding:24px 30px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{font-size:.65rem;text-transform:uppercase;letter-spacing:.23em;color:var(--orange);font-weight:900}.stamp{font-size:.68rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
  .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:44px 34px 30px;text-align:center}.club{font-size:clamp(1rem,2.4vw,1.45rem);font-weight:900;letter-spacing:.04em}.number{font-size:clamp(3rem,10vw,6.6rem);font-weight:900;line-height:.85}.dash{color:var(--muted);font-size:2rem}.resultText{text-align:center;color:var(--muted);margin-top:-12px;padding-bottom:28px;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase}
  .content{display:grid;grid-template-columns:1.1fr .9fr;border-top:1px solid rgba(255,255,255,.1)}.panel{padding:26px 30px}.panel+ .panel{border-left:1px solid rgba(255,255,255,.1)}h2{margin:0 0 18px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .stats{display:grid;grid-template-columns:1fr auto 1fr;gap:9px 15px;align-items:center;font-size:.79rem}.stats div:nth-child(3n+1){text-align:right;font-weight:900}.stats div:nth-child(3n+2){font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}.stats div:nth-child(3n){font-weight:900}
  .events{display:grid;gap:7px;max-height:330px;overflow:auto;padding-right:4px}.event{display:grid;grid-template-columns:46px 1fr;gap:9px;padding:9px 10px;background:#0b223a;border-left:3px solid rgba(255,255,255,.12);font-size:.75rem}.event.home{border-color:var(--orange)}.event.away{border-color:#dce7f2}.minute{font-weight:900;color:var(--muted)}.event b{display:block}.event small{display:block;color:var(--muted);margin-top:3px}
  footer{display:flex;justify-content:flex-end;gap:10px;padding:22px 30px;border-top:1px solid rgba(255,255,255,.1)}button{border:1px solid rgba(255,255,255,.18);background:#102b47;color:var(--cream);padding:14px 22px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}button:hover{border-color:var(--orange)}button.primary{background:var(--orange);color:#06182c;border-color:var(--orange)}
  #error{display:none;margin:20px 30px;padding:12px;background:#7f1d1d;color:white;font:12px monospace;white-space:pre-wrap}
  @media(max-width:720px){body{padding:0}.card{min-height:100vh}.content{grid-template-columns:1fr}.panel+.panel{border-left:0;border-top:1px solid rgba(255,255,255,.1)}.score{gap:10px;padding-inline:16px}footer{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<main class="card">
  <header><div><div class="eyebrow">Instant result</div></div><div class="stamp" id="stamp">Full time</div></header>
  <div id="error"></div>
  <section class="score">
    <div><div class="club" id="homeName">Ribble End</div></div>
    <div style="display:flex;align-items:center;gap:18px"><span class="number" id="homeScore">0</span><span class="dash">–</span><span class="number" id="awayScore">0</span></div>
    <div><div class="club" id="awayName">Sherwood</div></div>
  </section>
  <div class="resultText" id="resultText">Draw</div>
  <section class="content">
    <div class="panel"><h2>Match statistics</h2><div class="stats" id="stats"></div></div>
    <div class="panel"><h2>Key events</h2><div class="events" id="events"></div></div>
  </section>
  <footer><button id="exportBtn">Export report</button><button id="backBtn">Back to setup</button><button class="primary" id="continueBtn">Continue</button></footer>
</main>
<script src="instant-result.js"></script>
<script>
(function(){
  const error=document.getElementById('error');
  try{
    const queryParams=new URLSearchParams(location.search),query={};for(const [k,v] of queryParams)query[k]=v;
    let matchConfig={},tactics={},resume=null;
    try{matchConfig=JSON.parse(localStorage.getItem('footballLegacyMatchConfig')||'{}')||{};}catch(e){}
    try{tactics=JSON.parse(localStorage.getItem('footballLegacyTactics')||'{}')||{};}catch(e){}
    if(query.resume==='1'){try{resume=JSON.parse(localStorage.getItem('footballLegacyInstantResumeState')||'null');}catch(e){}}
    const report=FootballLegacyInstantSim.simulate({config:{matchConfig,tactics,query},current:resume||undefined,homeTeam:resume&&resume.homeTeam,awayTeam:resume&&resume.awayTeam});
    const names=report.teamNames||{you:'Ribble End',opp:'Sherwood'},hs=report.score.you,as=report.score.opp;
    document.getElementById('homeName').textContent=names.you;document.getElementById('awayName').textContent=names.opp;document.getElementById('homeScore').textContent=hs;document.getElementById('awayScore').textContent=as;
    document.getElementById('resultText').textContent=hs===as?'Draw':(hs>as?names.you+' win':names.opp+' win');
    const h=report.teams.you,a=report.teams.opp;
    const rows=[['Possession',h.possession+'%',a.possession+'%'],['Shots',h.shots,a.shots],['On target',h.onTarget,a.onTarget],['xG',Number(h.xg).toFixed(2),Number(a.xg).toFixed(2)],['Passes',h.passes,a.passes],['Pass accuracy',Math.round(100*h.completed/Math.max(1,h.passes))+'%',Math.round(100*a.completed/Math.max(1,a.passes))+'%'],['Tackles',h.tackles,a.tackles],['Fouls',h.fouls,a.fouls],['Corners',h.corners,a.corners],['Saves',h.saves,a.saves],['Cards',h.yellows+(h.reds?' / '+h.reds+' red':''),a.yellows+(a.reds?' / '+a.reds+' red':'')]];
    document.getElementById('stats').innerHTML=rows.map(r=>'<div>'+r[1]+'</div><div>'+r[0]+'</div><div>'+r[2]+'</div>').join('');
    const key=report.events.filter(e=>e.type==='goal'||e.type==='yellow-card'||e.type==='red-card').sort((x,y)=>x.minute-y.minute);
    document.getElementById('events').innerHTML=key.length?key.map(e=>{const goal=e.type==='goal',card=e.type==='yellow-card'?'Yellow card':e.type==='red-card'?'Red card':'';return '<div class="event '+(e.team==='you'?'home':'away')+'"><div class="minute">'+(e.minute>90?'90+'+(e.minute-90):e.minute)+"'</div><div><b>"+(goal?'Goal · '+e.player:card+' · '+e.player)+'</b>'+(goal&&e.assist?'<small>Assist: '+e.assist+'</small>':'')+'</div></div>';}).join(''):'<div class="event"><div class="minute">FT</div><div><b>No major incidents</b></div></div>';
    document.getElementById('stamp').textContent='Full time · +'+(report.summary&&report.summary.addedTime||0)+' min';
    document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='football-legacy-instant-result.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);};
    document.getElementById('backBtn').onclick=()=>location.href='index.html';
    document.getElementById('continueBtn').onclick=()=>{try{if(window.opener){window.opener.postMessage({type:'footballLegacyMatchComplete',mode:'instant',report},'*');window.close();return;}}catch(e){}const returnUrl=matchConfig.returnUrl||query.returnUrl;if(returnUrl){location.href=returnUrl;}else{location.href='index.html';}};
  }catch(err){error.style.display='block';error.textContent='Instant result error: '+err.message+'\n'+(err.stack||'');}
})();
</script>
<script src="../controller-ui.js"></script>
</body>
</html>
