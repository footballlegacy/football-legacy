<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Football Legacy FL V2 Quick Play redirect">
  <meta http-equiv="refresh" content="0; url=../quick-play/index.html?mode=single-player&amp;engine=fl-v2&amp;candidate=5">
  <title>Open FL V2 | Football Legacy</title>
  <style>
    :root{color-scheme:dark;--navy:#06182c;--deep:#03101f;--panel:#0a2138;--orange:#e87824;--cream:#f7f1e7;--muted:#aab7c5}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#16466c,transparent 42%),linear-gradient(145deg,var(--navy),var(--deep));color:var(--cream);font-family:Arial,Helvetica,sans-serif}
    main{width:min(680px,100%);padding:clamp(28px,7vw,58px);border:1px solid rgba(255,255,255,.14);border-top:4px solid var(--orange);background:rgba(10,33,56,.96);box-shadow:0 28px 80px rgba(0,0,0,.4)}
    span{color:var(--orange);font-size:.68rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:10px 0 14px;font:700 clamp(2rem,7vw,4rem)/1 Georgia,"Times New Roman",serif;text-transform:uppercase}
    p{margin:0 0 24px;color:var(--muted);line-height:1.65}
    a{display:inline-block;padding:15px 20px;background:var(--orange);color:var(--deep);font-size:.75rem;font-weight:900;letter-spacing:.12em;text-decoration:none;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <span>V2-only playable release</span>
    <h1>Opening FL V2</h1>
    <p>The old direct match setup has been retired. Every playable match now starts through Quick Play under the current FL V2 engine.</p>
    <a href="../quick-play/index.html?mode=single-player&amp;engine=fl-v2&amp;candidate=5">Open FL V2 Quick Play</a>
  </main>
</body>
</html>
