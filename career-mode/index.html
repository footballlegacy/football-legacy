<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Legacy v0.22.7</title>
  <style>
    :root {
      --navy: #06182c;
      --navy-deep: #03101f;
      --navy-soft: #0c2844;
      --orange: #e87824;
      --orange-hover: #f28b38;
      --cream: #f7f1e7;
      --muted: #aab7c5;
      --line: rgba(255,255,255,0.11);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--cream);
      background:
        radial-gradient(circle at 50% 35%, rgba(16, 58, 93, 0.42), transparent 38%),
        linear-gradient(145deg, var(--navy) 0%, var(--navy-deep) 72%);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, transparent, black 25%, black 80%, transparent);
    }

    .screen {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      isolation: isolate;
    }

    .year-mark {
      position: absolute;
      top: 30px;
      left: 34px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.76rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(247, 241, 231, 0.52);
    }

    .menu-shell {
      width: min(760px, 92vw);
      text-align: center;
      transform: translateY(-2vh);
    }

    .title-box {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: min(670px, 88vw);
      padding: 30px 54px 33px;
      background: var(--orange);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        0 18px 48px rgba(0,0,0,0.33),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .title-box::before,
    .title-box::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 66px;
      height: 1px;
      background: rgba(6, 24, 44, 0.46);
    }

    .title-box::before { left: 20px; }
    .title-box::after { right: 20px; }

    h1 {
      margin: 0;
      color: var(--navy-deep);
      font-size: clamp(2.5rem, 7vw, 5.35rem);
      line-height: 0.96;
      letter-spacing: 0.025em;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 1px 0 rgba(255,255,255,0.15);
    }

    .subtitle {
      margin: 28px 0 38px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(247, 241, 231, 0.72);
    }

    .menu-actions {
      width: min(430px, 86vw);
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .menu-button {
      width: 100%;
      border: 1px solid var(--line);
      padding: 17px 22px;
      color: var(--cream);
      background: rgba(255,255,255,0.035);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.92rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        transform 170ms ease,
        background 170ms ease,
        border-color 170ms ease,
        color 170ms ease;
    }

    .menu-button:hover,
    .menu-button:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(232,120,36,0.68);
      background: rgba(232,120,36,0.11);
      outline: none;
    }

    .menu-button.primary {
      background: var(--orange);
      color: var(--navy-deep);
      border-color: var(--orange);
      font-weight: 700;
    }

    .menu-button.primary:hover,
    .menu-button.primary:focus-visible {
      background: var(--orange-hover);
      border-color: var(--orange-hover);
    }

    .menu-button[disabled] {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
    }

    .edition {
      position: absolute;
      right: 34px;
      bottom: 28px;
      font-family: Arial, Helvetica, sans-serif;
      color: rgba(247,241,231,0.42);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .status {
      min-height: 22px;
      margin-top: 18px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    @media (max-width: 620px) {
      .screen {
        padding: 20px;
      }

      .year-mark {
        top: 20px;
        left: 20px;
      }

      .edition {
        right: 20px;
        bottom: 18px;
      }

      .title-box {
        min-width: 0;
        width: 100%;
        padding: 25px 18px 28px;
      }

      .title-box::before,
      .title-box::after {
        display: none;
      }

      .subtitle {
        letter-spacing: 0.2em;
        line-height: 1.6;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="year-mark">Est. 1888</div>

    <section class="menu-shell" aria-labelledby="game-title">
      <div class="title-box">
        <h1 id="game-title">Football Legacy</h1>
      </div>

      <p class="subtitle">History begins with you</p>

      <div class="menu-actions">
        <button class="menu-button primary" id="beginButton" type="button">
          Begin Your Legacy
        </button>
        <button class="menu-button" id="continueButton" type="button">
          Continue
        </button>
      </div>

      <p class="status" id="status" aria-live="polite"></p>
    </section>

    <div class="edition">v0.27.5.1 · gameplay and history integrity</div>
  </main>

  <script src="js/save.js?v=0.22.6"></script>
  <script>
    const beginButton = document.getElementById('beginButton');
    const continueButton = document.getElementById('continueButton');
    const status = document.getElementById('status');

    beginButton.addEventListener('click', () => {
      window.location.href = 'manager.html';
    });

    let hasSave = false;
    continueButton.disabled = true;
    (async()=>{
      hasSave = await FLSave.exists();
      continueButton.disabled = !hasSave;
    })().catch(()=>{continueButton.disabled=true});
    continueButton.addEventListener('click', () => {
      if(hasSave) window.location.href = 'game.html';
      else status.textContent = 'No saved legacy found.';
    });
  </script>
  <script src="../controller-ui.js"></script>
</body>
</html>
