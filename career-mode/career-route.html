<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Choose Your Career | Football Legacy</title>
<style>
:root{--navy:#06182c;--deep:#03101f;--panel:#0a2138;--orange:#e87824;--orange2:#f19342;--cream:#f4ead8;--muted:#aab7c5;--line:rgba(232,120,36,.28)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--cream)}body{background:radial-gradient(circle at 50% 0%,rgba(23,70,106,.4),transparent 38%),linear-gradient(145deg,var(--navy),var(--deep) 78%);display:grid;place-items:center;padding:24px}.page{width:min(1440px,100%)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;text-decoration:none;color:var(--cream)}.mark{width:48px;height:48px;display:grid;place-items:center;background:var(--orange);color:var(--deep);font:700 18px Georgia,serif}.brand strong{display:block;font:700 19px Georgia,serif;text-transform:uppercase;letter-spacing:.09em}.brand span{display:block;color:var(--muted);font-size:10px;letter-spacing:.17em;text-transform:uppercase;margin-top:4px}.hero{border-left:5px solid var(--orange);padding:2px 0 2px 17px;margin-bottom:22px}.hero span{color:var(--orange);font-size:10px;letter-spacing:.17em;text-transform:uppercase}.hero h1{margin:7px 0 7px;font:700 clamp(2.2rem,5vw,4.4rem) Georgia,serif;text-transform:uppercase}.hero p{margin:0;color:var(--muted)}.routes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.route{min-height:420px;display:flex;flex-direction:column;border:1px solid var(--line);background:rgba(8,31,54,.94);padding:24px;color:var(--cream);text-decoration:none;transition:.16s}.route:hover,.route:focus-visible{transform:translateY(-4px);border-color:var(--orange);outline:none}.route .number{color:var(--orange);font:700 42px Georgia,serif}.route h2{margin:20px 0 10px;font:700 30px Georgia,serif;text-transform:uppercase}.route p{color:var(--muted);line-height:1.55;margin:0}.route ul{margin:20px 0 26px;padding-left:19px;color:var(--cream);line-height:1.7}.route b{margin-top:auto;background:var(--orange);color:var(--deep);padding:14px 16px;text-align:center;text-transform:uppercase;letter-spacing:.11em;font-size:11px}.route.grassroots{background:linear-gradient(180deg,rgba(53,78,35,.42),rgba(8,31,54,.96));border-color:rgba(139,180,81,.55)}.route.player{background:linear-gradient(180deg,rgba(42,105,148,.4),rgba(8,31,54,.96));border-color:rgba(98,168,223,.58)}.route.player .number{color:#76b7e5}.route.player b{background:#76b7e5}.manager{margin-top:17px;padding:14px 18px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.14);color:var(--muted)}.manager strong{color:var(--cream)}.back{display:inline-block;margin-top:17px;color:var(--muted);text-decoration:none;text-transform:uppercase;letter-spacing:.12em;font-size:11px}@media(max-width:1100px){.routes{grid-template-columns:1fr 1fr}}@media(max-width:700px){.routes{grid-template-columns:1fr}.route{min-height:0}}
</style>
</head>
<body><main class="page"><a class="brand" href="../index.html"><span class="mark">FL</span><span><strong>Football Legacy</strong><span>Est. 1888</span></span></a><section class="hero"><span>Career Setup</span><h1>Opening Your Career</h1><p>Your career type was chosen on the main homepage and is locked for this setup session.</p></section></main><script>
const route=sessionStorage.getItem('footballLegacyCareerRoute');
if(route==='take-charge')location.replace('club-selection.html');
else if(route==='create-club')location.replace('../create-club/index.html?careerMode=career');
else location.replace('../index.html');
</script></body></html>
