<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · Football Legacy</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="settings.css"></head><body><main class="app-shell settings-shell"><header class="masthead"><div class="established">FOOTBALL LEGACY</div><div class="title-panel"><h1>Settings</h1></div><p class="tagline">Game preferences</p></header><form id="settingsForm" class="settings-form">
<section class="settings-card"><h2>Career saves</h2><label>Autosave response<select name="autosaveDelay"><option value="150">Frequent</option><option value="650">Balanced</option><option value="1500">Relaxed</option></select><small>Controls how quickly Career Mode commits changes after an action. Direct save points remain unchanged.</small></label></section>
<section class="settings-card"><h2>Quick Play defaults</h2><div class="settings-grid"><label>Match difficulty<select name="difficulty"><option value="amateur">Amateur</option><option value="professional">Professional</option><option value="world-class">World Class</option><option value="legendary">Legendary</option></select></label><label>Match length<select name="matchLength"><option value="4">4 minutes</option><option value="6">6 minutes</option><option value="8">8 minutes</option><option value="10">10 minutes</option></select></label><label>Camera<select name="camera"><option value="broadcast">Broadcast</option><option value="classic">Classic 2008</option><option value="dynamic">Dynamic</option><option value="endToEnd">End to end</option><option value="tactical">Tactical wide</option></select></label><label>Player switching<select name="autoSwitch"><option value="on">Automatic</option><option value="off">Manual</option></select></label></div></section>
<section class="settings-card"><h2>Presentation</h2><div class="settings-grid"><label>Sound volume<input name="volume" type="range" min="0" max="100" step="5"><output id="volumeOutput">70%</output></label><label class="toggle-row"><input name="reducedMotion" type="checkbox"><span>Reduced menu motion</span></label><label class="toggle-row"><input name="confirmBeforeMatch" type="checkbox"><span>Keep final confirmation before kickoff</span></label></div></section>
<div class="settings-actions"><a class="action-button" href="index.html">Back to Main Menu</a><button class="action-button" type="button" id="resetSettings">Restore Defaults</button><button class="action-button primary" type="submit">Save Settings</button></div><p id="settingsStatus" class="settings-status" aria-live="polite"></p></form></main><script src="settings.js"></script><script src="controller-ui.js"></script></body></html>
